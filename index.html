<style>

@media print{.top .tabs,.pie,.admin,.banner,.barra .mes button,.ed{display:none!important}.top{position:static}body{background:#fff}}
</style>

<body>
<header class="top">
  <div class="top-in">
    <h1 id="titulo">Iglesia de Cristo en Nuevo Tampico</h1>
    <p class="sub">Rol de participación</p>
  </div>
  <nav class="tabs" role="tablist" aria-label="Secciones">
    <button role="tab" data-act="tab" data-v="general" aria-selected="true">Rol general</button>
    <button role="tab" data-act="tab" data-v="practica" aria-selected="false">Práctica</button>
    <button role="tab" data-act="tab" data-v="mios" aria-selected="false">Mis turnos</button>
    <button role="tab" data-act="tab" data-v="personas" aria-selected="false">Personas</button>
  </nav>
</header>
<main id="app"><p class="vacio-total">Cargando el rol…</p></main>
<footer class="pie"><button id="adm" data-act="admin" aria-pressed="false">Modo encargado</button></footer>
<div id="modal" class="fondo" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>
<noscript><p style="padding:20px">Esta página necesita JavaScript activado para mostrar el rol.</p></noscript>

<script>
// ===== MOTOR-INICIO =====
// Rubros ("habilidades"): quién puede pasar a qué.
var RUBROS={dir:'Director (rol general)',him:'Himnos (rol general)',ser:'Sermón',chi:'Clase de himnos',cla:'Clase (fija)',pdi:'Director (práctica)',phi:'Himnos (práctica)',pin:'Interpretación (práctica)'};
// Turnos de cada domingo. fijo = siempre la(s) misma(s) persona(s); auto:false = opcional, no se genera solo.
var SLOTS=[
 {k:'mat.dir',serv:'mat',skill:'dir',etiqueta:'Director'},
 {k:'mat.him',serv:'mat',skill:'him',etiqueta:'Himnos'},
 {k:'mat.ser',serv:'mat',skill:'ser',etiqueta:'Sermón'},
 {k:'mat.cla',serv:'mat',skill:'cla',etiqueta:'Clase general',fijo:true},
 {k:'mat.chi',serv:'mat',skill:'chi',etiqueta:'Clase de himnos',auto:false},
 {k:'ves.dir',serv:'ves',skill:'dir',etiqueta:'Director'},
 {k:'ves.him',serv:'ves',skill:'him',etiqueta:'Himnos'},
 {k:'ves.cla',serv:'ves',skill:'cla',etiqueta:'Clase',fijo:true},
 {k:'ves.chi',serv:'ves',skill:'chi',etiqueta:'Clase de himnos'},
 {k:'pra.dir',serv:'pra',skill:'pdi',etiqueta:'Director'},
 {k:'pra.him',serv:'pra',skill:'phi',etiqueta:'Himnos'},
 {k:'pra.int',serv:'pra',skill:'pin',etiqueta:'Interpretación'}
];
var SLOT={};SLOTS.forEach(function(s){SLOT[s.k]=s;});
var BASE_MS=Date.UTC(2026,0,4); // un domingo de referencia
function aMs(iso){var p=iso.split('-').map(Number);return Date.UTC(p[0],p[1]-1,p[2]);}
function semanaIdx(iso){return Math.round((aMs(iso)-BASE_MS)/604800000);}
function sumarDias(iso,n){return new Date(aMs(iso)+n*86400000).toISOString().slice(0,10);}
function pool(D,skill){return D.personas.filter(function(p){return p.rubros.indexOf(skill)>=0;}).map(function(p){return p.id;});}
function ordenId(D,id){for(var i=0;i<D.personas.length;i++){if(D.personas[i].id===id)return i;}return 999;}
function ausente(D,id,f){return (D.ausencias||[]).some(function(a){return a.p===id&&a.desde<=f&&f<=a.hasta;});}

// Libro de cuentas: cuántas veces ha pasado cada quien, en qué rubro y cuándo fue la última vez.
function registrarSemana(L,f,sem){
  var w=semanaIdx(f);
  SLOTS.forEach(function(s){
    var id=sem[s.k];if(!id||!L[id])return;
    var e=L[id];
    e.cnt[s.skill]=(e.cnt[s.skill]||0)+1;
    if(s.skill!=='cla'){e.total++;e.lastAny=w;}
    e.last[s.skill]=w;
  });
}
function crearLibro(D){
  var L={};
  D.personas.forEach(function(p){L[p.id]={cnt:{},total:0,last:{},lastAny:null};});
  Object.keys(D.programacion).sort().forEach(function(f){registrarSemana(L,f,D.programacion[f]);});
  return L;
}
// Puntaje: MENOR = le toca primero.
function puntaje(L,id,skill,w){
  var e=L[id],s=(e.cnt[skill]||0)*4+e.total*0.5;        // menos veces en ese rubro y menos turnos en total
  var u=e.last[skill];if(u!=null){var d=w-u;if(d<=3)s+=(4-d)*1.5;}   // no repetir el mismo rubro en semanas seguidas
  if(e.lastAny!=null&&w-e.lastAny===1)s+=1.5;           // dar respiro si pasó la semana anterior
  if(e.lastAny!=null)s-=Math.min(w-e.lastAny,12)*0.05;   // desempate: quien lleva más sin pasar
  return s;
}
// Asigna los turnos del día buscando que nadie pase dos veces (con retroceso si hace falta).
function resolver(pend,usados,res,cand){
  if(!pend.length)return true;
  var idx=0,min=Infinity;
  pend.forEach(function(s,i){var n=cand[s.k].filter(function(c){return !usados.has(c.id);}).length;if(n<min){min=n;idx=i;}});
  var s=pend[idx],resto=pend.filter(function(_,i){return i!==idx;});
  for(var j=0;j<cand[s.k].length;j++){
    var c=cand[s.k][j];
    if(usados.has(c.id))continue;
    usados.add(c.id);res[s.k]=c.id;
    if(resolver(resto,usados,res,cand))return true;
    usados.delete(c.id);res[s.k]=null;
  }
  return false;
}
function armarSemana(D,L,f){
  var w=semanaIdx(f);
  var auto=SLOTS.filter(function(s){return s.auto!==false;});
  var cand={};
  auto.forEach(function(s){
    cand[s.k]=pool(D,s.skill).filter(function(id){return !ausente(D,id,f)&&L[id];})
      .map(function(id){return {id:id,sc:puntaje(L,id,s.skill,w)};})
      .sort(function(a,b){return a.sc-b.sc||ordenId(D,a.id)-ordenId(D,b.id);});
  });
  var res={};SLOTS.forEach(function(s){res[s.k]=null;});
  auto.filter(function(s){return s.fijo;}).forEach(function(s){if(cand[s.k].length)res[s.k]=cand[s.k][0].id;});
  var libres=auto.filter(function(s){return !s.fijo;});
  var usados=new Set();
  if(!resolver(libres,usados,res,cand)){
    // No hay forma de que nadie repita: se elige lo mejor evitando repetir en lo posible.
    libres.forEach(function(s){res[s.k]=null;});usados.clear();
    libres.slice().sort(function(a,b){return cand[a.k].length-cand[b.k].length;}).forEach(function(s){
      var c=cand[s.k].map(function(x){return {id:x.id,sc:x.sc+(usados.has(x.id)?100:0)};}).sort(function(a,b){return a.sc-b.sc;})[0];
      if(c){res[s.k]=c.id;usados.add(c.id);}
    });
  }
  return res;
}
// Agrega n domingos nuevos al final, sin tocar los anteriores.
function generarSemanas(D,n){
  var fechas=Object.keys(D.programacion).sort();
  var ult=fechas[fechas.length-1],L=crearLibro(D),nuevas=[];
  for(var i=0;i<n;i++){
    ult=sumarDias(ult,7);
    var sem=armarSemana(D,L,ult);
    D.programacion[ult]=sem;registrarSemana(L,ult,sem);nuevas.push(ult);
  }
  return nuevas;
}
// Reemplazos sugeridos para un turno concreto, ordenados del más al menos conveniente.
function sugerencias(D,fecha,k){
  var s=SLOT[k],w=semanaIdx(fecha),sem=D.programacion[fecha]||{};
  var hoyUsados=new Set();
  SLOTS.forEach(function(x){if(x.k!==k&&x.skill!=='cla'&&sem[x.k])hoyUsados.add(sem[x.k]);});
  var est={};D.personas.forEach(function(p){est[p.id]={cnt:0,total:0,cerca:99,cercaAny:99};});
  Object.keys(D.programacion).forEach(function(f){
    if(f===fecha)return;
    var dist=Math.abs(semanaIdx(f)-w),sm=D.programacion[f];
    SLOTS.forEach(function(x){
      var id=sm[x.k];if(!id||!est[id])return;
      var e=est[id];
      if(x.skill===s.skill){e.cnt++;e.cerca=Math.min(e.cerca,dist);}
      if(x.skill!=='cla'){e.total++;e.cercaAny=Math.min(e.cercaAny,dist);}
    });
  });
  return pool(D,s.skill).filter(function(id){return !ausente(D,id,fecha);}).map(function(id){
    var e=est[id],libre=!hoyUsados.has(id)||s.skill==='cla',sc=e.cnt*4+e.total*0.5;
    if(e.cerca<=3)sc+=(4-e.cerca)*1.5;
    if(e.cercaAny<=1)sc+=1.5;
    if(!libre)sc+=50;
    return {id:id,libre:libre,sc:sc,cnt:e.cnt,cerca:e.cerca};
  }).sort(function(a,b){return a.sc-b.sc||ordenId(D,a.id)-ordenId(D,b.id);});
}
// Texto de datos.js (una línea por semana para que sea fácil de leer).
function serializar(D){
  var copia=Object.assign({},D),prog=copia.programacion;delete copia.programacion;
  var filas=Object.keys(prog).sort().map(function(f){return '  '+JSON.stringify(f)+': '+JSON.stringify(prog[f]);}).join(',\n');
  var base=JSON.stringify(copia,null,1);
  return 'window.DATOS = '+base.replace(/\n}$/,',\n "programacion": {\n'+filas+'\n }\n}')+';\n';
}
// ===== MOTOR-FIN =====
</script>

<script>
(function(){
'use strict';
var D=null,hayLocal=false;
var S={tab:'general',mes:null,persona:'',yo:'',admin:false};
var LS_D='rolIglesia.datos',LS_YO='rolIglesia.yo',LS_ADM='rolIglesia.admin';
var SERV={mat:'Matutino',ves:'Vespertino',pra:'Práctica'};
var MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
var MES3=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
var DIAS=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];

function $(s,r){return (r||document).querySelector(s);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1);}
function fechaLarga(iso){var p=iso.split('-').map(Number),d=new Date(Date.UTC(p[0],p[1]-1,p[2]));return DIAS[d.getUTCDay()]+' '+p[2]+' de '+MESES[p[1]-1];}
function fechaCorta(iso){var p=iso.split('-').map(Number);return p[2]+' '+MES3[p[1]-1];}
function hoyISO(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function nom(id){var p=D.personas.find(function(x){return x.id===id;});return p?p.nombre:'—';}
function fechas(){return Object.keys(D.programacion).sort();}
function meses(){var o=[];fechas().forEach(function(f){var m=f.slice(0,7);if(o.indexOf(m)<0)o.push(m);});return o;}
function toast(t){var e=$('#toast');e.textContent=t;e.classList.add('ver');clearTimeout(toast.t);toast.t=setTimeout(function(){e.classList.remove('ver');},3800);}

/* ---------- carga y guardado ---------- */
function cargarDatos(){
  return new Promise(function(res){
    var s=document.createElement('script');
    s.src='datos.js?v='+Date.now();
    s.onload=function(){res(window.DATOS||null);};
    s.onerror=function(){res(null);};
    document.head.appendChild(s);
  });
}
function guardarLocal(){
  D.actualizado=new Date().toISOString();hayLocal=true;
  try{localStorage.setItem(LS_D,JSON.stringify(D));}catch(e){}
}
function descartarLocal(){
  try{localStorage.removeItem(LS_D);}catch(e){}
  location.reload();
}

/* ---------- consultas ---------- */
function turnosDe(id){
  var out=[];
  fechas().forEach(function(f){var sem=D.programacion[f];SLOTS.forEach(function(s){if(s.skill!=='cla'&&sem[s.k]===id)out.push({f:f,s:s});});});
  return out;
}
function repetido(f,id,s){
  if(!id||s.skill==='cla'||f<hoyISO())return false;
  var sem=D.programacion[f],n=0;
  SLOTS.forEach(function(x){if(x.skill!=='cla'&&sem[x.k]===id)n++;});
  return n>1;
}

/* ---------- vistas ---------- */
function celda(f,s,sem){
  var id=sem[s.k];
  if(s.auto===false&&!id&&!S.admin)return '';
  var quien=S.persona||S.yo,mia=quien&&id===quien;
  var n=id?'<span>'+esc(nom(id))+'</span>':'<span class="vacio">'+(s.auto===false?'Opcional':'Por asignar')+'</span>';
  var av=repetido(f,id,s)?'<span class="aviso" title="Tiene otro turno ese día">repite</span>':'';
  var ed=S.admin?'<button class="ed" data-act="editar" data-f="'+f+'" data-k="'+s.k+'" aria-label="Cambiar '+esc(s.etiqueta)+'">✎</button>':'';

function pintarAus(){

  var h='';
  if(!filas.length)h='<p class="mut">No tiene turnos programados en esas fechas. Se anotará la ausencia para que no se le asigne en semanas nuevas.</p>';

    T.programacion[r.f][r.k]=def||null;
    h+='<div class="cambio"><p><strong>'+esc(cap(fechaLarga(r.f)))+'</strong><br>'+SERV[SLOT[r.k].serv]+' · '+esc(SLOT[r.k].etiqueta)+'</p>'+selectorCambio(T,r.k,p,sug,def,'sel-'+i)+'</div>';

function aplicarAus(){
  var p=$('#a-p').value,d=$('#a-d').value,hh=$('#a-h').value||d;
  if(!d||hh<d){toast('Revisa las fechas');return;}
  var filas=filasAus(p,d,hh),ahora=new Date().toISOString();
  D.registro=D.registro||[];D.ausencias=D.ausencias||[];
  filas.forEach(function(r,i){
    var el=$('#sel-'+i);if(!el)return;
    var v=el.value||null;
    D.programacion[r.f][r.k]=v;
    D.registro.push({cuando:ahora,fecha:r.f,rubro:r.k,de:p,a:v,motivo:'Ausencia'});
  });
  D.ausencias.push({p:p,desde:d,hasta:hh});
  guardarLocal();cerrarModal();render();
  toast(filas.length?filas.length+(filas.length===1?' turno cambiado':' turnos cambiados')+'. Falta publicar.':'Ausencia anotada.');

document.addEventListener('click',function(e){
  if(e.target.id==='modal'){cerrarModal();return;}
  var b=e.target.closest('[data-act]');if(!b)return;
  var a=b.dataset.act;
  if(a==='tab'){S.tab=b.dataset.v;render();window.scrollTo(0,0);}
  else if(a==='mes'){var ms=meses(),i=ms.indexOf(S.mes)+Number(b.dataset.v);if(i>=0&&i<ms.length){S.mes=ms[i];render();}}
  else if(a==='admin'){S.admin=!S.admin;try{localStorage.setItem(LS_ADM,S.admin?'1':'0');}catch(x){}render();}
  else if(a==='editar')abrirCambio(b.dataset.f,b.dataset.k);
  else if(a==='m-aus')abrirAusencia();
  else if(a==='m-gen')abrirGenerar();
  else if(a==='m-pub')abrirPublicar();
  else if(a==='cerrar')cerrarModal();
  else if(a==='aplicar-aus')aplicarAus();
  else if(a==='aplicar-slot')aplicarSlot(b.dataset.f,b.dataset.k);
  else if(a==='aplicar-gen'){
    var n=Number($('#g-n').value),nuevas=generarSemanas(D,n);
    guardarLocal();cerrarModal();S.mes=nuevas[0].slice(0,7);render();toast(n+' semanas generadas. Falta publicar.');
  }
  else if(a==='descargar')descargar();
  else if(a==='descartar'){if(confirm('¿Descartar los cambios que no has publicado?'))descartarLocal();}
  else if(a==='quitar'){
    var p=D.personas.find(function(x){return x.id===b.dataset.p;});
    p.rubros=p.rubros.filter(function(r){return r!==b.dataset.r;});guardarLocal();render();toast('Se aplicará en las semanas que generes de ahora en adelante.');
  }
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='f-persona'){S.persona=t.value;render();}
  else if(t.id==='f-yo'){S.yo=t.value;try{localStorage.setItem(LS_YO,S.yo);}catch(x){}render();}

cargarDatos().then(function(base){
  var local=null;
  try{local=JSON.parse(localStorage.getItem(LS_D)||'null');}catch(e){}
  if(base&&local&&local.actualizado>base.actualizado){D=local;hayLocal=true;}
  else{D=base||local;hayLocal=!base&&!!local;if(base&&local){try{localStorage.removeItem(LS_D);}catch(e){}}}
  if(!D){$('#app').innerHTML='<p class="vacio-total">No se pudo cargar el rol. Revisa que el archivo datos.js esté junto a index.html.</p>';return;}
  D.registro=D.registro||[];D.ausencias=D.ausencias||[];
  if(D.iglesia){$('#titulo').textContent=D.iglesia;document.title='Rol de servicio · '+D.iglesia;}
  try{S.yo=localStorage.getItem(LS_YO)||'';S.admin=localStorage.getItem(LS_ADM)==='1';}catch(e){}
  if(S.yo&&!D.personas.some(function(p){return p.id===S.yo;}))S.yo='';
  var ms=meses(),hm=hoyISO().slice(0,7);
  S.mes=ms.indexOf(hm)>=0?hm:ms[ms.length-1];
  render();
});
})();
</script>
